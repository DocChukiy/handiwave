<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handiwave Kaduna Professional Recruitment Flyer</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { background: #dff8e8; display: grid; place-items: center; }
      .flyer {
        background: url('./handiwave-kaduna-professionals-flyer.png') center / cover no-repeat;
        height: 1402px;
        overflow: hidden;
        position: relative;
        width: 1122px;
      }
      .qr-panel {
        align-items: center;
        background: #fff;
        border: 3px solid #dcfce7;
        border-radius: 24px;
        bottom: 70px;
        box-shadow: 0 12px 35px rgba(5, 46, 35, 0.28);
        display: grid;
        gap: 12px;
        grid-template-columns: 112px 1fr;
        padding: 12px;
        position: absolute;
        right: 24px;
        width: 350px;
      }
      .qr-panel img { display: block; height: 112px; width: 112px; }
      .qr-panel p { color: #14532d; font: 800 14px/1.25 Arial, sans-serif; margin: 0 0 7px; text-transform: uppercase; }
      .qr-panel strong { color: #061925; display: block; font: 900 18px/1.05 Arial, sans-serif; }
      .qr-panel small { color: #475569; display: block; font: 700 11px/1.3 Arial, sans-serif; margin-top: 7px; }
      .disclaimer {
        bottom: 18px;
        color: #e7fff0;
        font: 600 12px/1.25 Arial, sans-serif;
        position: absolute;
        right: 50px;
        text-align: right;
        width: 570px;
      }
      @media print {
        @page { margin: 0; size: 1122px 1402px; }
        body { background: transparent; }
      }
    </style>
  </head>
  <body>
    <main class="flyer">
      <section class="qr-panel" aria-label="Tracked application link">
        <img src="./kaduna-professional-join-qr.svg" alt="QR code for the Handiwave Kaduna professional application" />
        <div>
          <p>Barnawa–Narayi pilot</p>
          <strong>handiwave.com.ng<br />/go/kaduna</strong>
          <small>Scan to apply free. Applications are reviewed before activation.</small>
        </div>
      </section>
      <p class="disclaimer">Handiwave does not guarantee jobs. Opportunities depend on customer demand and successful verification.</p>
    </main>
  </body>
</html>
